<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/cart.css">
    <title>Your Shopping Cart</title>
</head>
<body>
    
    <!-- MAIN CART CONTAINER (No longer a hidden modal) -->
    <div class="cart-container">
        <!-- Navigation back to index -->
        <button class="back-btn" onclick="window.location.href='/'">&larr; Back to Shop</button>

        <h2>Your Shopping Cart</h2>
        
        <div id="cart_items_container">
            <!-- Items will be injected here by JavaScript -->
        </div>
        
        <hr>
        <div class="cart-footer">
            <h3>Total: ₹<span id="cart_total">0</span></h3>
            <button id="checkout_btn">Checkout</button>
        </div>
    </div>

    <script src="static/cart.js"></script>
</body>
</html>
